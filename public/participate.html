<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REGISTRATION // Quantum Net</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/auth.js"></script>
</head>
<body class="text-slate-100 font-sans min-h-screen bg-[#030014]">
    <script>Auth.require('user');</script>
    <nav class="bg-[#05021a]/90 backdrop-blur-md border-b-2 border-purple-500/40 px-12 py-5 flex justify-between items-center sticky top-0 z-50">
        <div class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 tracking-widest text-2xl">⚡ QUANTUM_NET</div>
        <div class="flex items-center space-x-8 text-base font-bold uppercase tracking-widest">
            <a href="/events.html" class="text-cyan-400">Event Grid</a>
            <a href="/dashboard.html" class="text-slate-400 hover:text-cyan-300">Dashboard</a>
            <button onclick="Auth.logout()" class="text-red-400 hover:text-red-300">Sign Out</button>
        </div>
    </nav>

    <div class="max-w-md mx-auto px-6 py-20">
        <div class="bg-[#0b0724] border-2 border-purple-500/40 p-8 rounded-xl shadow-2xl">
            <span class="text-xs font-extrabold text-cyan-300 bg-cyan-950/50 border border-cyan-500/30 px-3 py-1 rounded uppercase">Step 1: Identification</span>
            <h1 class="text-2xl font-black text-purple-400 mt-4 mb-1">EVENT REGISTRATION</h1>
            <p id="event-title" class="text-xs text-slate-400 mb-6 uppercase">Loading event...</p>

            <form id="participationForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Agent Name</label>
                    <input type="text" id="username" required maxlength="60" class="w-full bg-[#030014] border border-purple-500/30 rounded px-4 py-3 text-cyan-300 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Agent Email Frequency</label>
                    <input type="email" id="user_email" readonly class="w-full bg-[#030014] border border-slate-800 rounded px-4 py-3 text-slate-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-cyan-600 text-white font-black py-3 rounded text-sm uppercase">Initialize Registration</button>
                <p id="error" class="text-red-400 text-xs font-bold hidden"></p>
            </form>
        </div>
    </div>

    <script>
        const eventId = new URLSearchParams(location.search).get('id');
        if (!eventId) location.replace('/events.html');
        document.getElementById('user_email').value = Auth.email;
        document.getElementById('username').value = Auth.name || '';
        let eventTitle = '';

        (async () => {
            const res = await fetch(`/api/events/${eventId}`);
            if (!res.ok) return location.replace('/events.html');
            eventTitle = (await res.json()).title;
            document.getElementById('event-title').textContent = `Event: ${eventTitle}`;
        })();

        document.getElementById('participationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('error');
            err.classList.add('hidden');
            const res = await api('/api/register', {
                method: 'POST',
                body: JSON.stringify({ event_id: eventId, username: document.getElementById('username').value })
            });
            const result = await res.json();
            if (res.ok && result.success) {
                if (result.free) { location.href = '/dashboard.html'; return; }
                location.href = `/payment.html?ticket_id=${result.ticket_id}&event=${encodeURIComponent(eventTitle)}`;
            } else {
                err.textContent = result.error || 'Registration failed.';
                err.classList.remove('hidden');
            }
        });
    </script>
    <script src="/aura-net.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COMMS CHANNEL // Quantum Net</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/auth.js"></script>
    <style>
        .cosmic-glow { text-shadow: 0 0 15px rgba(168, 85, 247, 0.7); }
        body {
            background-color: #030014;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(126, 34, 206, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.12) 0%, transparent 40%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        body.light-theme {
            background-color: #f3f4f6 !important;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(126, 34, 206, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.06) 0%, transparent 40%),
                linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
            color: #1e293b !important;
        }
        body.light-theme nav { background-color: rgba(255, 255, 255, 0.95) !important; border-bottom-color: rgba(168, 85, 247, 0.3) !important; }
        body.light-theme .dynamic-card { background: #ffffff !important; border-color: rgba(168,85,247,0.3) !important; color: #1e293b !important; }
        body.light-theme input, body.light-theme textarea { background-color: #f8fafc !important; color: #0f172a !important; border-color: #cbd5e1 !important; }
        body.light-theme .text-slate-400 { color: #64748b !important; }
        body.light-theme .text-purple-400 { color: #7e22ce !important; text-shadow: none !important; }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen transition-colors duration-300">
    <nav class="bg-[#05021a]/90 backdrop-blur-md border-b-2 border-purple-500/40 px-12 py-5 flex justify-between items-center sticky top-0 z-50 shadow-[0_4px_20px_rgba(0,0,0,0.8)]">
        <div class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 tracking-widest text-2xl cosmic-glow">⚡ QUANTUM_NET</div>
        <div class="flex items-center space-x-8 text-base font-bold uppercase tracking-widest">
            <a href="/index.html" class="text-slate-400 hover:text-cyan-300">Command</a>
            <a href="/events.html" class="text-slate-400 hover:text-cyan-300">Event Grid</a>
            <a href="/about.html" class="text-slate-400 hover:text-cyan-300">About Protocol</a>
            <a href="/contact.html" class="text-cyan-400">Comms</a>
            <a href="/login.html" class="text-slate-400 hover:text-cyan-300">Sign In</a>
            <button onclick="toggleTheme()" id="theme-toggle" class="bg-slate-900 border border-purple-500 text-purple-300 px-4 py-2 rounded text-xs hover:bg-purple-500 hover:text-white transition">🌙 THEME</button>
        </div>
    </nav>

    <div class="max-w-xl mx-auto px-6 py-16">
        <div class="dynamic-card bg-[#0b0724] border-2 border-purple-500/40 p-10 rounded-xl shadow-[0_0_25px_rgba(168,85,247,0.15)]">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-purple-400 mb-3 cosmic-glow tracking-wider">SECURE COMMS TERMINAL</h1>
                <p class="text-base text-slate-400 font-medium">Transmit inquiries directly to root controllers and network administration.</p>
            </div>

            <form onsubmit="handleContact(event)" class="space-y-6 text-base font-medium">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">AGENT_ALIAS</label>
                    <input type="text" id="c-name" maxlength="60" placeholder="Agent Name" required class="w-full bg-[#030014] border-2 border-slate-800 p-4 rounded text-cyan-300 focus:outline-none focus:border-purple-500 text-base">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">SECURE_FREQUENCY (EMAIL)</label>
                    <input type="email" id="c-email" maxlength="120" placeholder="agent@quantum.org" required class="w-full bg-[#030014] border-2 border-slate-800 p-4 rounded text-cyan-300 focus:outline-none focus:border-purple-500 text-base">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">TRANSMISSION MESSAGE</label>
                    <textarea rows="4" id="c-message" minlength="5" maxlength="2000" placeholder="Enter secure dispatch note..." required class="w-full bg-[#030014] border-2 border-slate-800 p-4 rounded text-cyan-300 focus:outline-none focus:border-purple-500 text-base"></textarea>
                </div>
                <p id="c-feedback" class="text-sm font-bold hidden"></p>
                <button type="submit" id="c-btn" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-black py-4 rounded tracking-widest hover:scale-105 transition shadow-[0_0_25px_rgba(168,85,247,0.4)]">
                    TRANSMIT DISPATCH
                </button>
            </form>
        </div>
    </div>



    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('theme-toggle').innerText = isLight ? '☀️ STARK' : '🌙 COSMIC';
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('theme-toggle').innerText = '☀️ STARK';
        }

        if (Auth.token) {
            document.getElementById('c-email').value = Auth.email || '';
            document.getElementById('c-name').value = Auth.name || '';
        }
        async function handleContact(e) {
            e.preventDefault();
            const fb = document.getElementById('c-feedback');
            const btn = document.getElementById('c-btn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('c-name').value,
                        email: document.getElementById('c-email').value,
                        message: document.getElementById('c-message').value
                    })
                });
                const data = await res.json();
                fb.textContent = res.ok ? data.message : (data.error || 'Transmission failed.');
                fb.className = 'text-sm font-bold ' + (res.ok ? 'text-cyan-400' : 'text-red-400');
                if (res.ok) document.getElementById('c-message').value = '';
            } catch (err) {
                fb.textContent = 'Could not reach the mainframe. Try again.';
                fb.className = 'text-sm font-bold text-red-400';
            }
            btn.disabled = false;
        }

    </script>
    <script src="/aura-net.js" defer></script>
</body>
</html>

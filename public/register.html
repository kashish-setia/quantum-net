<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AGENT ENROLLMENT // Quantum Net</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/auth.js"></script>
    <style>
        .cosmic-glow { text-shadow: 0 0 15px rgba(168, 85, 247, 0.7); }
        body {
            background-color: #030014;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(126, 34, 206, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.12) 0%, transparent 40%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex items-center justify-center p-6">
    <div class="bg-[#0b0724] border-2 border-purple-500/40 p-8 rounded-2xl w-full max-w-md shadow-[0_0_35px_rgba(168,85,247,0.2)]">
        <div class="text-center mb-6">
            <div class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 tracking-widest text-2xl cosmic-glow mb-2">⚡ QUANTUM_NET</div>
            <h2 class="text-xl font-black text-purple-400 uppercase tracking-wider">Agent Enrollment</h2>
            <p class="text-xs text-slate-400 mt-1">Register your secure frequency to join event nodes and claim tickets.</p>
        </div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Agent Alias / Full Name</label>
                <input type="text" id="name" required minlength="2" maxlength="60" placeholder="Agent Nova" class="w-full bg-[#030014] border border-purple-500/30 rounded-lg p-3 text-cyan-300 text-sm focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Email Frequency</label>
                <input type="email" id="email" required placeholder="agent.nova@quantum.net" class="w-full bg-[#030014] border border-purple-500/30 rounded-lg p-3 text-cyan-300 text-sm focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Cipher Key / Password <span class="text-slate-500 text-[10px]">(min 6 chars)</span></label>
                <input type="password" id="password" required minlength="6" placeholder="••••••••" class="w-full bg-[#030014] border border-purple-500/30 rounded-lg p-3 text-cyan-300 text-sm focus:outline-none focus:border-purple-500">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Confirm Cipher Key</label>
                <input type="password" id="confirm" required minlength="6" placeholder="••••••••" class="w-full bg-[#030014] border border-purple-500/30 rounded-lg p-3 text-cyan-300 text-sm focus:outline-none focus:border-purple-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 text-white font-black py-3 rounded-lg text-xs uppercase tracking-widest transition shadow-[0_0_20px_rgba(168,85,247,0.3)]">
                INITIALIZE AGENT ACCOUNT
            </button>
            <p id="error" class="text-red-400 text-xs font-bold text-center hidden"></p>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
            Already registered? <a href="/login.html" class="text-cyan-400 font-bold hover:underline">Access Terminal (Sign In)</a>
        </p>
        <a href="/index.html" class="block text-center text-xs text-slate-500 hover:text-cyan-300 mt-3 uppercase tracking-wider">← Return to Command</a>
    </div>

    <script>
        if (Auth.token) location.replace(Auth.role === 'ADMIN' ? '/admin.html' : '/events.html');

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('error');
            const btn = document.getElementById('submitBtn');
            err.classList.add('hidden');

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                err.textContent = 'Cipher keys do not match.';
                err.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'TRANSMITTING CREDENTIALS...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || data.error || 'Enrollment failed.');

                Auth.save(data);
                location.replace('/events.html');
            } catch (ex) {
                err.textContent = ex.message;
                err.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'INITIALIZE AGENT ACCOUNT';
            }
        });
    </script>
    <script src="/aura-net.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SECURE CHECKOUT // Quantum Net</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-slate-100 font-sans min-h-screen bg-[#030014]">
    <script src="/auth.js"></script>
    <script>Auth.require('user');</script>
    <nav class="bg-[#05021a]/90 backdrop-blur-md border-b-2 border-purple-500/40 px-12 py-5 flex justify-between items-center sticky top-0 z-50">
        <div class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400 tracking-widest text-2xl">⚡ QUANTUM_NET</div>
        <div class="flex items-center space-x-8 text-base font-bold uppercase tracking-widest">
            <a href="/events.html" class="text-cyan-400">Event Grid</a>
            <a href="/dashboard.html" class="text-slate-400 hover:text-cyan-300">Dashboard</a>
            <button onclick="logout()" class="text-red-400 hover:text-red-300">Sign Out</button>
        </div>
    </nav>

    <div class="max-w-md mx-auto px-6 py-20">
        <div class="bg-[#0b0724] border-2 border-purple-500/40 p-8 rounded-xl shadow-2xl text-center">
            <span class="text-xs font-extrabold text-cyan-300 bg-cyan-950/50 border border-cyan-500/30 px-3 py-1 rounded uppercase">Step 2: Settlement</span>
            <h1 class="text-2xl font-black text-purple-400 mt-4 mb-1">SECURE PAYMENT GATEWAY</h1>
            <p id="display-event" class="text-xs text-slate-400 mb-6 uppercase">Event Pass Fee: 50 Q-Credits</p>

            <form onsubmit="handlePayment(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Quantum Wallet / Card Cipher</label>
                    <input type="text" required class="w-full bg-[#030014] border border-purple-500/30 rounded px-4 py-3 text-cyan-300 text-sm focus:outline-none" id="card" inputmode="numeric" autocomplete="cc-number" maxlength="23" placeholder="1234 5678 9012 3456">
                </div>
                <div class="flex space-x-4">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Expiry</label>
                        <input type="text" required class="w-full bg-[#030014] border border-purple-500/30 rounded px-4 py-3 text-cyan-300 text-sm focus:outline-none" id="expiry" inputmode="numeric" autocomplete="cc-exp" maxlength="5" placeholder="MM/YY">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-2">CVV</label>
                        <input type="password" required maxlength="4" id="cvv" inputmode="numeric" autocomplete="cc-csc" class="w-full bg-[#030014] border border-purple-500/30 rounded px-4 py-3 text-cyan-300 text-sm focus:outline-none" placeholder="123">
                    </div>
                </div>
                <button type="submit" id="pay-btn" class="w-full bg-gradient-to-r from-purple-600 to-cyan-600 text-white font-black py-3 rounded text-sm mt-4">
                    AUTHORIZE PAYMENT & ISSUE PASS
                </button>
            </form>
            <div id="payment-feedback" class="mt-4 text-xs font-bold hidden"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ticketId = urlParams.get('ticket_id');
        const eventName = urlParams.get('event');
        if (!ticketId) window.location.href = '/dashboard.html';

        (async () => {
            const res = await api(`/api/registrations/${ticketId}`);
            if (!res.ok) return location.replace('/dashboard.html');
            const t = await res.json();
            if (t.payment === 'Authorized') return location.replace('/dashboard.html');
            document.getElementById('display-event').textContent = `Event: ${t.event_title} — Pass Fee: ${t.fee} Q-Credits`;
        })();

        document.getElementById('card').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 19).replace(/(.{4})/g, '$1 ').trim();
        });
        document.getElementById('expiry').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '').slice(0, 4);
            e.target.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
        });

        async function handlePayment(e) {
            e.preventDefault();
            const feedback = document.getElementById('payment-feedback');
            const btn = document.getElementById('pay-btn');
            btn.disabled = true;

            try {
                const res = await api('/api/pay', { method: 'POST', body: JSON.stringify({ ticket_id: ticketId, card_number: document.getElementById('card').value, expiry: document.getElementById('expiry').value, cvv: document.getElementById('cvv').value }) });
                const data = await res.json();
                if (res.ok) {
                    feedback.textContent = 'Payment authorized! Pass ' + (data.pass_code || '') + ' generated.';
                    feedback.className = 'mt-4 text-xs font-bold text-cyan-400';
                    feedback.classList.remove('hidden');
                    setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
                } else {
                    feedback.textContent = data.error || 'Payment declined.';
                    feedback.className = 'mt-4 text-xs font-bold text-red-400';
                    feedback.classList.remove('hidden');
                    btn.disabled = false;
                }
            } catch (err) {
                btn.disabled = false;
                feedback.textContent = 'Gateway connection lost.';
                feedback.className = 'mt-4 text-xs font-bold text-red-400';
                feedback.classList.remove('hidden');
            }
        }

        function logout() {
            Auth.logout();
        }
    </script>
    <script src="/aura-net.js" defer></script>
</body>
</html>
